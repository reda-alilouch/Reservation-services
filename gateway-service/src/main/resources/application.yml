spring:
  application:
    name: gateway-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://config-server:8888}
      fail-fast: ${CONFIG_FAIL_FAST:true}
      retry:
        initial-interval: 1000
        max-attempts: 10
        max-interval: 5000
        multiplier: 1.5

