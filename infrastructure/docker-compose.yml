services:
  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reda2005

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  eureka-server:
    build: ../eureka-server
    container_name: eureka-server

    ports:
      - "8761:8761"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-server:
    build: ../config-server
    container_name: config-server

    ports:
      - "8888:8888"

    environment:
      SPRING_PROFILES_ACTIVE: native
      
    depends_on:
      eureka-server:
        condition: service_healthy

    volumes:
      - ../config-repo:/config-repo

    restart: unless-stopped

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway-service:
    build: ../gateway-service
    container_name: gateway-service

    ports:
      - "8080:8080"

    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

  auth-service:
    build: ../auth-service
    container_name: auth-service
    restart: unless-stopped
    
    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

  hotel-service:
    build: ../hotel-service
    container_name: hotel-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka

volumes:
  postgres_data:

networks:
  default:
    name: microservices-network
