services:
  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reda2005

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ../eureka-server
    container_name: eureka-server

    ports:
      - "8761:8761"

    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/stat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build: ../config-server
    container_name: config-server

    ports:
      - "8888:8888"

    depends_on:
      eureka-server:
        condition: service_healthy

    volumes:
      - ../config-repo:/config-repo

    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/stat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build: ../gateway-service
    container_name: gateway-service

    ports:
      - "8080:8080"

    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888

  auth-service:
    build: ../auth-service
    container_name: auth-service

    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

volumes:
  postgres_data:
